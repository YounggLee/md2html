<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
  <style>
    :root { color-scheme: light; --accent: #0969da; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #1f2328;
    }

    /* Reading progress */
    .read-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), #6f42c1);
      width: 0; z-index: 100; transition: width 100ms linear;
    }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 32px; max-width: 1180px;
      margin: 0 auto; padding: 32px 24px;
    }

    /* TOC */
    .toc {
      position: sticky; top: 24px; align-self: start;
      max-height: calc(100vh - 48px); overflow: auto;
      font-size: 14px; border-left: 2px solid #d0d7de;
      padding: 4px 12px;
    }
    .toc h2 {
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.04em; color: #57606a; margin: 0 0 8px;
    }
    .toc ul { list-style: none; padding-left: 0; margin: 0; }
    .toc ul ul { padding-left: 14px; }
    .toc li { margin: 4px 0; }
    .toc a {
      color: #1f2328; text-decoration: none; display: inline-block;
      border-left: 2px solid transparent; padding-left: 6px; margin-left: -8px;
      transition: color 150ms, border-color 150ms;
    }
    .toc a:hover { color: var(--accent); }
    .toc a.active { color: var(--accent); font-weight: 600; border-left-color: var(--accent); }

    /* Article */
    .markdown-body { box-sizing: border-box; min-width: 0; max-width: 880px; }
    .markdown-body :is(h1,h2,h3) { scroll-margin-top: 24px; position: relative; }
    .markdown-body :is(h1,h2,h3) .heading-anchor {
      position: absolute; left: -22px; top: 50%;
      transform: translateY(-50%);
      opacity: 0; transition: opacity 150ms;
      text-decoration: none; color: #8b949e; font-weight: 400; font-size: 0.7em;
    }
    .markdown-body :is(h1,h2,h3):hover .heading-anchor { opacity: 1; }

    /* Mermaid */
    .markdown-body pre.mermaid { background: transparent; padding: 0; text-align: center; }

    /* Code copy */
    .markdown-body pre:not(.mermaid) { position: relative; }
    .code-copy {
      position: absolute; top: 8px; right: 8px;
      background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 6px; padding: 4px 10px;
      font-size: 12px; cursor: pointer; opacity: 0;
      transition: opacity 150ms; font-family: inherit;
    }
    .markdown-body pre:not(.mermaid):hover .code-copy { opacity: 1; }
    .code-copy.copied { background: #dafbe1; border-color: #2da44e; color: #1a7f37; opacity: 1; }

    /* Status pill */
    .status-pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 600; vertical-align: middle;
    }
    .status-pill[data-status="Draft"]       { background: #fff8c5; color: #735c0f; }
    .status-pill[data-status="Review"]      { background: #ddf4ff; color: #0969da; }
    .status-pill[data-status="Approved"]    { background: #dafbe1; color: #1a7f37; }
    .status-pill[data-status="In Progress"] { background: #fff1e5; color: #bc4c00; }
    .status-pill[data-status="Implemented"] { background: #ede2ff; color: #6639ba; }

    /* API method badge */
    .method-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px; font-weight: 700; margin-right: 6px;
      vertical-align: middle;
    }
    .method-badge.GET     { background: #dafbe1; color: #1a7f37; }
    .method-badge.POST    { background: #ddf4ff; color: #0969da; }
    .method-badge.PUT     { background: #fff1e5; color: #bc4c00; }
    .method-badge.PATCH   { background: #fff8c5; color: #735c0f; }
    .method-badge.DELETE  { background: #ffebe9; color: #cf222e; }
    .method-badge.HEAD,
    .method-badge.OPTIONS { background: #eaeef2; color: #57606a; }

    /* Checkbox progress */
    .checkbox-progress {
      display: flex; align-items: center; gap: 10px;
      margin: 4px 0 14px; font-size: 13px; color: #57606a;
    }
    .checkbox-progress-bar {
      flex: 1; max-width: 260px; height: 6px;
      background: #eaeef2; border-radius: 999px; overflow: hidden;
    }
    .checkbox-progress-bar > span {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #2da44e, #218739);
      transition: width 600ms cubic-bezier(.2,.8,.2,1);
    }

    /* Fade-in */
    .fade-in { opacity: 0; transform: translateY(8px); transition: opacity 400ms ease, transform 400ms ease; }
    .fade-in.visible { opacity: 1; transform: none; }

    /* External link icon */
    .markdown-body a[href^="http"]::after { content: "\2197"; font-size: 0.85em; margin-left: 2px; color: #57606a; }

    /* Sortable tables */
    .markdown-body th[data-sortable] { cursor: pointer; user-select: none; }
    .markdown-body th[data-sortable]::after { content: " \2195"; opacity: 0.35; font-size: 0.85em; }
    .markdown-body th[data-sort="asc"]::after  { content: " \2191"; opacity: 1; }
    .markdown-body th[data-sort="desc"]::after { content: " \2193"; opacity: 1; }

    /* Responsive */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .toc { position: static; max-height: none; border-left: none; padding: 0; }
    }

    /* Print */
    @media print {
      .toc, .read-progress, .code-copy, .heading-anchor { display: none !important; }
      .layout { grid-template-columns: 1fr; max-width: none; padding: 0; }
      .markdown-body { max-width: none; }
      .markdown-body pre, .markdown-body blockquote { break-inside: avoid; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fade-in { opacity: 1; transform: none; transition: none; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* === Sticky 섹션 칩 바 === */
    .section-chips {
      position: sticky; top: 8px; z-index: 50;
      background: rgba(255,255,255,0.94);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 8px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      margin: 0 0 20px;
      font-size: 13px;
    }
    .section-chip {
      padding: 4px 12px; border-radius: 999px;
      background: #f6f8fa; border: 1px solid #d0d7de;
      color: #57606a; cursor: pointer; text-decoration: none;
      white-space: nowrap;
      transition: background 150ms, color 150ms, border-color 150ms;
    }
    .section-chip:hover { background: #eaeef2; color: #1f2328; }
    .section-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* === 긴 코드 블록 접기 === */
    .code-collapse-wrap { position: relative; margin: 16px 0; }
    .code-collapse-wrap.collapsed > pre { max-height: 12em; overflow: hidden; margin-bottom: 0; }
    .code-collapse-wrap.collapsed::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 32px;
      height: 60px; pointer-events: none;
      background: linear-gradient(180deg, rgba(246,248,250,0), #f6f8fa);
    }
    .code-toggle {
      display: block; width: 100%;
      border: 1px solid #d0d7de; border-top: none;
      border-radius: 0 0 6px 6px;
      background: #f6f8fa; color: var(--accent);
      padding: 6px 12px; font-size: 12px;
      cursor: pointer; font-family: inherit;
      text-align: left;
    }
    .code-toggle:hover { background: #eaeef2; }

    /* === "↑ 위로" 떠 있는 버튼 === */
    .to-top {
      position: fixed; right: 28px; bottom: 28px;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--accent); color: #fff;
      border: none; cursor: pointer;
      font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none;
      transition: opacity 200ms;
      z-index: 40;
    }
    .to-top.visible { opacity: 0.88; pointer-events: auto; }
    .to-top:hover { opacity: 1; }

    /* === 본문 검색 오버레이 === */
    .search-overlay {
      position: fixed; top: 16px; left: 50%;
      transform: translateX(-50%);
      background: #fff; border: 1px solid #d0d7de;
      border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      padding: 10px 14px; z-index: 60;
      display: none; align-items: center; gap: 10px;
      font-size: 14px;
    }
    .search-overlay.visible { display: flex; }
    .search-overlay input {
      width: 260px; border: none; outline: none;
      font-size: 14px; font-family: inherit;
    }
    .search-overlay .count {
      color: #57606a; font-size: 12px; min-width: 56px; text-align: right;
    }
    .search-overlay .key {
      font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px;
      background: #f6f8fa; padding: 2px 6px; border-radius: 3px;
      color: #57606a; border: 1px solid #d0d7de;
    }
    mark.search-hit { background: #fff8c5; color: inherit; border-radius: 2px; }
    mark.search-hit.current { background: #ffd33d; box-shadow: 0 0 0 2px #ffd33d; }

    /* === 요구사항 필터 알약 === */
    .filter-pills {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin: 6px 0 14px;
      font-size: 13px;
    }
    .filter-pill {
      padding: 3px 10px; border-radius: 999px;
      background: #fff; border: 1px solid #d0d7de;
      color: #57606a; cursor: pointer; font-family: inherit;
      transition: all 150ms;
    }
    .filter-pill:hover { background: #f6f8fa; color: #1f2328; }
    .filter-pill.active { background: #1f2328; color: #fff; border-color: #1f2328; }

    /* === 인터페이스 병렬 비교 === */
    .compare-toggle {
      margin: 12px 0 0;
      background: #ddf4ff; border: 1px solid #54aeff;
      color: var(--accent);
      padding: 6px 14px; border-radius: 6px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .compare-toggle:hover { background: #b6e3ff; }
    .compare-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin: 12px 0 24px;
    }
    .compare-col h4 {
      font-size: 13px; color: #57606a; margin: 0 0 6px;
    }
    .compare-col pre { max-height: 520px; overflow: auto; }
    @media (max-width: 1100px) { .compare-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="read-progress" aria-hidden="true"></div>

  <div class="layout">
    <nav class="toc" aria-label="목차">
      <h2>목차</h2>
      {{TOC}}
    </nav>

    <article class="markdown-body">
      {{CONTENT}}
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true, theme: 'default' });
  </script>

  <script>
    (function () {
      const article = document.querySelector('.markdown-body');
      if (!article) return;

      // 1) Reading progress
      const pbar = document.querySelector('.read-progress');
      const updatePbar = () => {
        const h = document.documentElement;
        const max = h.scrollHeight - h.clientHeight;
        const pct = max > 0 ? (h.scrollTop / max) * 100 : 0;
        pbar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      };
      document.addEventListener('scroll', updatePbar, { passive: true });
      updatePbar();

      // 2) Heading anchors (hover icon, click copies URL)
      article.querySelectorAll(':scope :is(h1,h2,h3)[id]').forEach(h => {
        const a = document.createElement('a');
        a.className = 'heading-anchor';
        a.href = '#' + h.id;
        a.textContent = '#';
        a.setAttribute('aria-label', '이 섹션 링크 복사');
        a.addEventListener('click', () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(location.href.split('#')[0] + '#' + h.id).catch(() => {});
          }
        });
        h.prepend(a);
      });

      // 3) Code copy buttons (skip Mermaid)
      article.querySelectorAll('pre:not(.mermaid)').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code) return;
        const btn = document.createElement('button');
        btn.className = 'code-copy';
        btn.type = 'button';
        btn.textContent = '복사';
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(code.textContent);
            btn.textContent = '복사됨';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1200);
          } catch (e) {
            btn.textContent = '실패';
          }
        });
        pre.appendChild(btn);
      });

      // 4) Status pill transform (looks for **상태:** Draft pattern)
      const STATUSES = ['Draft', 'Review', 'Approved', 'In Progress', 'Implemented'];
      const statusRe = new RegExp('^\\s*[::]?\\s*(' + STATUSES.join('|').replace(/ /g, '\\s+') + ')\\b');
      article.querySelectorAll('strong').forEach(s => {
        if (!/^상태[::]?$/.test(s.textContent.trim())) return;
        const next = s.nextSibling;
        if (!next || next.nodeType !== 3) return;
        const m = next.nodeValue.match(statusRe);
        if (!m) return;
        const span = document.createElement('span');
        span.className = 'status-pill';
        span.dataset.status = m[1];
        span.textContent = m[1];
        next.nodeValue = next.nodeValue.slice(m[0].length);
        s.after(' ', span);
      });

      // 5) API method badge for inline `METHOD /path`
      article.querySelectorAll('code').forEach(c => {
        if (c.closest('pre')) return;
        const m = c.textContent.match(/^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)(?:\s+(\S.*))?$/);
        if (!m) return;
        const badge = document.createElement('span');
        badge.className = 'method-badge ' + m[1];
        badge.textContent = m[1];
        if (m[2]) {
          const path = document.createElement('code');
          path.textContent = m[2];
          c.replaceWith(badge, ' ', path);
        } else {
          c.replaceWith(badge);
        }
      });

      // 6) Checkbox progress per H2 section
      article.querySelectorAll('h2[id]').forEach(h2 => {
        const items = [];
        let cur = h2.nextElementSibling;
        while (cur && cur.tagName !== 'H2') {
          items.push(...cur.querySelectorAll('li > input[type="checkbox"]'));
          cur = cur.nextElementSibling;
        }
        if (items.length < 2) return;
        const done = items.filter(i => i.checked).length;
        const pct = Math.round((done / items.length) * 100);
        const wrap = document.createElement('div');
        wrap.className = 'checkbox-progress';
        wrap.innerHTML =
          '<span>' + done + ' / ' + items.length + '</span>' +
          '<div class="checkbox-progress-bar"><span></span></div>' +
          '<span>' + pct + '%</span>';
        h2.after(wrap);
        requestAnimationFrame(() => {
          wrap.querySelector('.checkbox-progress-bar > span').style.width = pct + '%';
        });
      });

      // 7) Fade-in on enter
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add('visible');
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.05 });
        article.querySelectorAll(':scope > :is(h2,h3,p,ul,ol,pre,blockquote,table,div.checkbox-progress)').forEach(el => {
          el.classList.add('fade-in');
          io.observe(el);
        });
      }

      // 8) TOC scroll-spy
      const tocLinks = document.querySelectorAll('.toc a[href^="#"]');
      const targets = new Map();
      tocLinks.forEach(a => {
        const raw = a.getAttribute('href').slice(1);
        let id = raw;
        try { id = decodeURIComponent(raw); } catch (e) {}
        const t = document.getElementById(id) || document.getElementById(raw);
        if (t) targets.set(t, a);
      });
      if ('IntersectionObserver' in window && targets.size) {
        const spy = new IntersectionObserver(entries => {
          entries.forEach(e => {
            const a = targets.get(e.target);
            if (!a) return;
            if (e.isIntersecting) {
              tocLinks.forEach(x => x.classList.remove('active'));
              a.classList.add('active');
            }
          });
        }, { rootMargin: '0px 0px -70% 0px' });
        targets.forEach((_, t) => spy.observe(t));
      }

      // 9) Sortable tables
      article.querySelectorAll('table').forEach(table => {
        const ths = table.querySelectorAll('thead th');
        if (!ths.length) return;
        ths.forEach((th, idx) => {
          th.dataset.sortable = '';
          th.addEventListener('click', () => {
            const tbody = table.querySelector('tbody');
            if (!tbody) return;
            const rows = [...tbody.querySelectorAll('tr')];
            const asc = th.dataset.sort !== 'asc';
            ths.forEach(x => x.removeAttribute('data-sort'));
            th.dataset.sort = asc ? 'asc' : 'desc';
            rows.sort((a, b) => {
              const av = a.children[idx] ? a.children[idx].textContent.trim() : '';
              const bv = b.children[idx] ? b.children[idx].textContent.trim() : '';
              const an = parseFloat(av), bn = parseFloat(bv);
              const cmp = !isNaN(an) && !isNaN(bn) ? an - bn : av.localeCompare(bv, 'ko');
              return asc ? cmp : -cmp;
            });
            rows.forEach(r => tbody.appendChild(r));
          });
        });
      });

      // 10) sticky 섹션 칩 바
      const h2sForChips = [...article.querySelectorAll('h2[id]')];
      if (h2sForChips.length >= 2) {
        const bar = document.createElement('nav');
        bar.className = 'section-chips';
        bar.setAttribute('aria-label', '섹션 빠른 이동');
        h2sForChips.forEach(h => {
          const chip = document.createElement('a');
          chip.className = 'section-chip';
          chip.href = '#' + h.id;
          const clone = h.cloneNode(true);
          clone.querySelectorAll('.heading-anchor').forEach(a => a.remove());
          chip.textContent = clone.textContent.trim();
          bar.appendChild(chip);
        });
        article.prepend(bar);

        const chips = [...bar.querySelectorAll('.section-chip')];
        const chipByHash = new Map(chips.map(c => {
          let id = c.getAttribute('href').slice(1);
          try { id = decodeURIComponent(id); } catch (e) {}
          return [id, c];
        }));
        if ('IntersectionObserver' in window) {
          const ioChip = new IntersectionObserver(entries => {
            entries.forEach(e => {
              const chip = chipByHash.get(e.target.id);
              if (!chip) return;
              if (e.isIntersecting) {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
              }
            });
          }, { rootMargin: '0px 0px -75% 0px' });
          h2sForChips.forEach(h => ioChip.observe(h));
        }
      }

      // 11) 긴 코드 블록 접기 (>15줄)
      article.querySelectorAll('pre:not(.mermaid)').forEach(pre => {
        const code = pre.querySelector('code');
        if (!code) return;
        const lines = code.textContent.split('\n').length;
        if (lines <= 15) return;
        const wrap = document.createElement('div');
        wrap.className = 'code-collapse-wrap collapsed';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = document.createElement('button');
        btn.className = 'code-toggle';
        btn.type = 'button';
        btn.textContent = '▼ 코드 펼치기 (' + lines + '줄)';
        btn.addEventListener('click', () => {
          const collapsed = wrap.classList.toggle('collapsed');
          btn.textContent = collapsed
            ? '▼ 코드 펼치기 (' + lines + '줄)'
            : '▲ 접기';
        });
        wrap.appendChild(btn);
      });

      // 12) "↑ 위로" 떠 있는 버튼
      const toTop = document.createElement('button');
      toTop.className = 'to-top';
      toTop.type = 'button';
      toTop.title = '맨 위로';
      toTop.setAttribute('aria-label', '맨 위로');
      toTop.textContent = '↑';
      toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      document.body.appendChild(toTop);
      window.addEventListener('scroll', () => {
        toTop.classList.toggle('visible', window.scrollY > 400);
      }, { passive: true });

      // 13) 본문 검색 (`/`)
      const sov = document.createElement('div');
      sov.className = 'search-overlay';
      sov.innerHTML =
        '<input type="text" placeholder="본문 검색…" aria-label="본문 검색" />' +
        '<span class="count">0 / 0</span>' +
        '<span class="key" title="다음">Enter</span>' +
        '<span class="key" title="이전">⇧Enter</span>' +
        '<span class="key" title="닫기">Esc</span>';
      document.body.appendChild(sov);
      const sinput = sov.querySelector('input');
      const scount = sov.querySelector('.count');
      let hits = []; let hitIdx = -1;
      const clearHighlights = () => {
        article.querySelectorAll('mark.search-hit').forEach(m => {
          const t = document.createTextNode(m.textContent);
          m.replaceWith(t);
        });
        article.normalize();
        hits = []; hitIdx = -1;
      };
      const focusHit = () => {
        hits.forEach(h => h.classList.remove('current'));
        if (hitIdx < 0 || hitIdx >= hits.length) {
          scount.textContent = '0 / ' + hits.length;
          return;
        }
        const h = hits[hitIdx];
        h.classList.add('current');
        h.scrollIntoView({ block: 'center', behavior: 'smooth' });
        scount.textContent = (hitIdx + 1) + ' / ' + hits.length;
      };
      const doSearch = (query) => {
        clearHighlights();
        if (!query) { scount.textContent = '0 / 0'; return; }
        const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
          acceptNode: n => {
            if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
            if (n.parentElement.closest('script,style,.section-chips,.filter-pills,.code-toggle,mark.search-hit')) {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        const matches = [];
        let node;
        while ((node = walker.nextNode())) {
          re.lastIndex = 0;
          if (re.test(node.nodeValue)) matches.push(node);
        }
        matches.forEach(n => {
          const text = n.nodeValue;
          const frag = document.createDocumentFragment();
          let lastIdx = 0; re.lastIndex = 0;
          let m;
          while ((m = re.exec(text)) !== null) {
            if (m.index > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
            const mark = document.createElement('mark');
            mark.className = 'search-hit';
            mark.textContent = m[0];
            frag.appendChild(mark);
            hits.push(mark);
            lastIdx = m.index + m[0].length;
            if (m[0].length === 0) re.lastIndex++;
          }
          if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
          n.replaceWith(frag);
        });
        hitIdx = hits.length ? 0 : -1;
        focusHit();
      };
      sinput.addEventListener('input', e => doSearch(e.target.value));
      document.addEventListener('keydown', e => {
        if (e.target === sinput) {
          if (e.key === 'Escape') {
            sov.classList.remove('visible');
            clearHighlights();
            sinput.value = '';
            e.preventDefault();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (!hits.length) return;
            hitIdx = e.shiftKey ? (hitIdx - 1 + hits.length) % hits.length : (hitIdx + 1) % hits.length;
            focusHit();
          }
          return;
        }
        if (e.target.matches('input,textarea')) return;
        if (e.key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey) {
          e.preventDefault();
          sov.classList.add('visible');
          sinput.focus();
          sinput.select();
        }
      });

      // 14) 요구사항 필터 알약 — `## 기능 요구사항` H2가 있을 때만 트리거
      const requirementH2 = h2sForChips.find(h => {
        const c = h.cloneNode(true);
        c.querySelectorAll('.heading-anchor').forEach(a => a.remove());
        return c.textContent.trim().startsWith('기능 요구사항');
      });
      if (requirementH2) {
        const subs = [];
        let cur = requirementH2.nextElementSibling;
        while (cur && cur.tagName !== 'H2') {
          if (cur.tagName === 'H3') {
            const ul = cur.nextElementSibling && cur.nextElementSibling.tagName === 'UL' ? cur.nextElementSibling : null;
            if (ul) {
              const c = cur.cloneNode(true);
              c.querySelectorAll('.heading-anchor').forEach(a => a.remove());
              subs.push({ heading: cur, list: ul, label: c.textContent.trim() });
            }
          }
          cur = cur.nextElementSibling;
        }
        if (subs.length) {
          const pills = document.createElement('div');
          pills.className = 'filter-pills';
          const filters = [
            { label: '전체', kind: 'all' },
            ...subs.map(s => ({ label: s.label.replace(/\s*\(.+\)$/, ''), kind: 'sub', subLabel: s.label })),
            { label: '완료', kind: 'done' },
            { label: '미완료', kind: 'undone' },
          ];
          const apply = (f) => {
            subs.forEach(sub => {
              sub.heading.style.display = '';
              sub.list.style.display = '';
              [...sub.list.children].forEach(li => li.style.display = '');
            });
            if (f.kind === 'sub') {
              subs.forEach(sub => {
                if (sub.label !== f.subLabel) {
                  sub.heading.style.display = 'none';
                  sub.list.style.display = 'none';
                }
              });
            } else if (f.kind === 'done' || f.kind === 'undone') {
              const wantChecked = f.kind === 'done';
              subs.forEach(sub => {
                let any = false;
                [...sub.list.children].forEach(li => {
                  const cb = li.querySelector('input[type=checkbox]');
                  const ok = cb && cb.checked === wantChecked;
                  li.style.display = ok ? '' : 'none';
                  if (ok) any = true;
                });
                if (!any) {
                  sub.heading.style.display = 'none';
                  sub.list.style.display = 'none';
                }
              });
            }
          };
          filters.forEach((f, idx) => {
            const p = document.createElement('button');
            p.className = 'filter-pill' + (idx === 0 ? ' active' : '');
            p.type = 'button';
            p.textContent = f.label;
            p.addEventListener('click', () => {
              pills.querySelectorAll('.filter-pill').forEach(x => x.classList.remove('active'));
              p.classList.add('active');
              apply(f);
            });
            pills.appendChild(p);
          });
          requirementH2.after(pills);
        }
      }

      // 15) 인터페이스 병렬 비교 — 문서에 Java interface 정의가 정확히 2개일 때만 트리거
      const ifaceRe = /public\s+interface\s+(\w+)/;
      const ifaces = [...article.querySelectorAll('pre > code.language-java')]
        .map(c => ({ code: c, m: c.textContent.match(ifaceRe) }))
        .filter(x => x.m);
      if (ifaces.length === 2) {
        const A = ifaces[0], B = ifaces[1];
        const nameA = A.m[1], nameB = B.m[1];
        const insertAfter = B.code.closest('.code-collapse-wrap') || B.code.parentElement;
        const cmpBtn = document.createElement('button');
        cmpBtn.className = 'compare-toggle';
        cmpBtn.type = 'button';
        const initialLabel = '↔ ' + nameA + ' ↔ ' + nameB + ' 병렬 보기';
        cmpBtn.textContent = initialLabel;
        let grid = null;
        cmpBtn.addEventListener('click', () => {
          if (grid) {
            grid.remove(); grid = null;
            cmpBtn.textContent = initialLabel;
            return;
          }
          grid = document.createElement('div');
          grid.className = 'compare-grid';
          const colA = document.createElement('div'); colA.className = 'compare-col';
          const colB = document.createElement('div'); colB.className = 'compare-col';
          const hA = document.createElement('h4'); hA.textContent = nameA;
          const hB = document.createElement('h4'); hB.textContent = nameB;
          colA.appendChild(hA); colB.appendChild(hB);
          const mk = (src) => {
            const pre = document.createElement('pre');
            const code = document.createElement('code');
            code.className = src.className;
            code.textContent = src.textContent;
            pre.appendChild(code);
            return { pre, code };
          };
          const PA = mk(A.code), PB = mk(B.code);
          colA.appendChild(PA.pre); colB.appendChild(PB.pre);
          grid.appendChild(colA); grid.appendChild(colB);
          insertAfter.parentNode.insertBefore(grid, insertAfter.nextSibling);
          if (window.hljs) { hljs.highlightElement(PA.code); hljs.highlightElement(PB.code); }
          cmpBtn.textContent = '✕ 병렬 보기 닫기';
        });
        insertAfter.parentNode.insertBefore(cmpBtn, insertAfter.nextSibling);
      }
    })();
  </script>
</body>
